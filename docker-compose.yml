
version: "3.8"

services:

  postgres-db:
    image: postgres:15-alpine
    container_name: delivery-monolith-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_password
      POSTGRES_DB: delivery_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U delivery_user -d delivery_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - delivery-network

  delivery-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: delivery-monolith-app
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://delivery_user:delivery_password@postgres-db:5432/delivery_db
      APP_ENV: development
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./src:/app/src

    depends_on:
      postgres-db:
        condition: service_healthy

    networks:
      - delivery-network

networks:
  delivery-network:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: delivery-monolith-postgres-data



